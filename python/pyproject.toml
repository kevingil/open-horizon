[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-bridge"
version = "0.3.0"
description = "Python worker for Open Horizon: verifiers environments, trainers, tokenizers. Driven by the Rust control plane over NDJSON."
requires-python = ">=3.11"
# The base worker is stdlib-only so `make dev` never needs a venv.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]
# verifiers env backend (profile routes_to="verifiers").
envs = ["verifiers>=0.1.11,<0.2", "openai>=1.50,<3"]
# In-tree GRPO-lite trainer and the tokenized recorder.
train = ["torch>=2.2,<3", "transformers>=4.45,<6", "peft>=0.12,<2"]
# prime-rl trainer backend. Requires [train] as well.
prime-rl = ["prime-rl"]

[tool.setuptools.packages.find]
where = ["."]
include = ["horizon_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP042"]
