[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-distributed-rl"
version = "0.1.0"
description = "Long-horizon distributed reinforcement learning with thin observability UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24.4,<26",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "anyio>=4,<5",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]
# Real GRPO trainer. Heavy deps; opt in only when training. Recommended
# install order on a GPU box:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
#   pip install -e '.[train]'
train = [
  "torch>=2.2,<3",
  "transformers>=4.45,<6",
  "peft>=0.12,<2",
]
# Verifiers env backend (RL_ENV_BACKEND=verifiers). For installing Hub
# envs (rlm, opencode/*, ...) you'll also want the Prime Intellect CLI:
#   pip install prime  # or `pipx install prime`
envs = [
  "verifiers>=0.1.11,<0.2",
]
# prime-rl trainer backend (RL_TRAINER_BACKEND=prime-rl). Installs the
# CLI we shell out to plus the heavy GPU stack it needs at training
# time. Requires the [train] extras above; install with:
#   pip install -e '.[train,prime-rl]'
prime-rl = [
  "prime-rl",
]

[project.scripts]
rl-replay = "interface.cli.replay:main"
rl-train = "interface.cli.train:main"
rl-eval = "interface.cli.eval:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bootstrap", "runtime_logging", "settings"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
python_functions = "test_*"
python_classes = "Test*"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
